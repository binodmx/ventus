<div class="card">
    <div class="card-header">
        Input Diffuser Parameters
    </div>
    <div class="card-body">
      <form  #f="ngForm">
        <div class="form-group row">
          <label for="inletHeight" class="col-md-4 col-form-label">Inlet Height (cm)</label>
          <div class="col-md-4">
            <input type="number" min="15" max="150" id="inletHeight" class="form-control" name="inletHeight" ngModel required>
            <small id="inletHeight" class="form-text text-muted">Please enter a value between 15cm and 150cm</small>
          </div>
        </div>
        <div class="form-group row">
          <label for="outletHeight" class="col-md-4 col-form-label">Outlet Height (cm)</label>
          <div class="col-md-4">
            <input type="number" min="15" max="500" id="outletHeight" class="form-control" name="outletHeight" ngModel required>
            <small id="inletHeight" class="form-text text-muted">Please enter a value between 15cm and 500cm</small>
          </div>
        </div>
        <div class="form-group row">
          <label for="coneAngle" class="col-md-4 col-form-label">Cone Angle (degrees)</label>
          <div class="col-md-4">
            <input type="number" min="3" max="6" id="coneAngle" class="form-control" name="coneAngle" ngModel required>
            <small id="inletHeight" class="form-text text-muted">Please enter a value between 3° and 6°</small>
          </div>
        </div>
        
      </form>
    </div>
</div>
<br>
<div class="row">
  <div class="col-sm">
    <button type="button" class="btn btn-secondary btn-block" (click)="onClickBack()">Back</button>
  </div>
  <br><br>
  <div class="col-sm">
    <button type="button" class="btn btn-success btn-block" (click)="onClickNext(f)" [disabled]="!f.valid">
      Find
      <span *ngIf="clicked"><div class="lds-dual-ring"></div></span>
    </button>
  </div>
</div>
